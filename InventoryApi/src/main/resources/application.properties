spring.application.name=InventoryApi
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=sandeep
spring.datasource.password=sandeep
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=sam
spring.flyway.enabled=true
spring.flyway.schemas=sam
spring.flyway.validateOnMigrate=false
spring.flyway.repair-on-migrate=false
spring.datasource.initialization-mode=always
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:init.sql
spring.sql.init.continue-on-error=true

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationPurposeOnlyKeepItVerySecureAndDontShareIt
jwt.expiration=900000
jwt.refresh.expiration=604800000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-specific-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Expiry Notification Email
expiry.notification.email=m.k.sandeep@gmail.com

# Enable scheduling
spring.task.scheduling.pool.size=1

# CORS
spring.mvc.cors.allowed-origins=http://localhost:3000
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# Redis Caching - DISABLED for development (no Redis server required)
# To enable Redis caching in production, uncomment below and set spring.cache.type=redis
spring.cache.type=none

# Redis configuration (disabled by default for development)
