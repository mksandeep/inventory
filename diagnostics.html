0returning <!DOCTYPE html>
<html>
<head>
    <title>API Diagnostics</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .card { background: white; padding: 20px; margin: 10px 0; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .info { color: #666; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f8f8; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Inventory System - API Diagnostics</h1>

    <div class="card">
        <h2>1. Authentication Status</h2>
        <button onclick="checkAuth()">Check Auth</button>
        <div id="auth-result" style="margin-top: 10px;"></div>
    </div>

    <div class="card">
        <h2>2. Backend API Status</h2>
        <button onclick="checkBackend()">Test Backend</button>
        <div id="backend-result" style="margin-top: 10px;"></div>
    </div>

    <div class="card">
        <h2>3. Fetch Products</h2>
        <button onclick="testProducts()">Test Products API</button>
        <div id="products-result" style="margin-top: 10px;"></div>
    </div>

    <script>
        function checkAuth() {
            const token = localStorage.getItem('token');
            const refreshToken = localStorage.getItem('refreshToken');
            const user = localStorage.getItem('user');

            const div = document.getElementById('auth-result');
            if (token) {
                div.innerHTML = `<p class="success">✅ Token found</p>
                    <pre>${token.substring(0, 50)}...</pre>
                    <p>User: ${user}</p>`;
            } else {
                div.innerHTML = `<p class="error">❌ No token - You may not be logged in</p>
                    <p class="info">Token: ${token}</p>
                    <p class="info">RefreshToken: ${refreshToken}</p>`;
            }
        }

        function checkBackend() {
            const div = document.getElementById('backend-result');
            div.innerHTML = '<p>Testing...</p>';

            fetch('http://localhost:8080/api/products', {
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token') || 'test'}`
                }
            })
            .then(r => {
                div.innerHTML = `<p class="success">✅ Backend responding (Status: ${r.status})</p>`;
            })
            .catch(e => {
                div.innerHTML = `<p class="error">❌ Backend not responding</p>
                    <p class="info">Error: ${e.message}</p>
                    <p class="info">Make sure backend is running on http://localhost:8080</p>`;
            });
        }

        function testProducts() {
            const div = document.getElementById('products-result');
            div.innerHTML = '<p>Loading...</p>';

            const token = localStorage.getItem('token');
            if (!token) {
                div.innerHTML = `<p class="error">❌ No auth token - Please login first</p>`;
                return;
            }

            fetch('http://localhost:8080/api/products', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(r => r.json())
            .then(data => {
                div.innerHTML = `<p class="success">✅ Products loaded: ${data.length} items</p>
                    <pre>${JSON.stringify(data.slice(0, 2), null, 2)}</pre>`;
            })
            .catch(e => {
                div.innerHTML = `<p class="error">❌ Failed to load products</p>
                    <p class="info">Error: ${e.message}</p>`;
            });
        }

        window.onload = () => {
            checkAuth();
        };
    </script>
</body>
</html>
